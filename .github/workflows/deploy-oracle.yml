name: Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      renew_tls:
        description: Renew the production TLS certificate and enable automatic renewal
        type: boolean
        default: false

concurrency:
  group: oracle-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !inputs.renew_tls }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Stamp verified revision
        run: printf '%s\n' "$GITHUB_SHA" > public/release.txt

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle ~/.ssh/known_hosts

      - name: Upload staged release
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          release="/home/opc/thingalong-releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rsync -az \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='/data' \
            --exclude='.env*' \
            --exclude='.next/cache/' \
            --exclude='output/' \
            --exclude='tmp/' \
            --rsync-path="mkdir -p '$release' && rsync" \
            -e 'ssh -i ~/.ssh/oracle' \
            ./ "$USER@$HOST:$release/"

      - name: Activate and verify release
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          release="/home/opc/thingalong-releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/oracle "$USER@$HOST" \
            "node -e 'require(\"node:sqlite\")' && bash '$release/deploy/install-clis.sh' && sudo install -m 0644 '$release/deploy/thingalong.service' /etc/systemd/system/thingalong.service && sudo systemctl daemon-reload && bash '$release/deploy/activate-release.sh' '$release' /home/opc/thingalong '$GITHUB_SHA'"

      - name: Verify public revision
        run: |
          test "$(curl --fail --silent --show-error --max-time 15 https://thinkalong.ai.kr/release.txt)" = "$GITHUB_SHA"
          curl --fail --silent --show-error --max-time 15 https://thinkalong.ai.kr/projects >/dev/null
          test "$(curl --silent --show-error --max-time 15 -o /tmp/director-remote-health.json -w '%{http_code}' -H 'Origin: https://thinkalong.ai.kr' -H 'Content-Type: application/json' --data '{"action":"me"}' https://thinkalong.ai.kr/api/remote)" = 401

  renew-tls:
    if: ${{ inputs.renew_tls }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Renew certificate and enable Certbot timer
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/oracle "$USER@$HOST" 'bash -se' <<'REMOTE'
          sudo nginx -t
          sudo certbot renew --cert-name thinkalong.ai.kr --non-interactive
          sudo systemctl enable --now certbot-renew.timer
          systemctl is-enabled certbot-renew.timer
          systemctl is-active certbot-renew.timer
          systemctl list-timers --all certbot-renew.timer --no-pager
          sudo certbot renew --cert-name thinkalong.ai.kr --non-interactive --dry-run
          REMOTE

      - name: Verify public HTTPS
        run: |
          for host in thinkalong.ai.kr www.thinkalong.ai.kr; do
            curl --fail --silent --show-error --max-time 15 --output /dev/null --write-out '%{url_effective} %{http_code}\n' "https://$host/"
          done
