name: Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inspect_tls:
        description: Inspect the production TLS renewal setup
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.inspect_tls && 'oracle-tls-observation' || 'oracle-production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !inputs.inspect_tls }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Stamp verified revision
        run: printf '%s\n' "$GITHUB_SHA" > public/release.txt

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle ~/.ssh/known_hosts

      - name: Upload staged release
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          release="/home/opc/thingalong-releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rsync -az \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='/data' \
            --exclude='.env*' \
            --exclude='.next/cache/' \
            --exclude='output/' \
            --exclude='tmp/' \
            --rsync-path="mkdir -p '$release' && rsync" \
            -e 'ssh -i ~/.ssh/oracle' \
            ./ "$USER@$HOST:$release/"

      - name: Activate and verify release
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          release="/home/opc/thingalong-releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/oracle "$USER@$HOST" \
            "node -e 'require(\"node:sqlite\")' && bash '$release/deploy/install-clis.sh' && sudo install -m 0644 '$release/deploy/thingalong.service' /etc/systemd/system/thingalong.service && sudo systemctl daemon-reload && bash '$release/deploy/activate-release.sh' '$release' /home/opc/thingalong '$GITHUB_SHA'"

      - name: Verify public revision
        run: |
          test "$(curl --fail --silent --show-error --max-time 15 https://thinkalong.ai.kr/release.txt)" = "$GITHUB_SHA"
          curl --fail --silent --show-error --max-time 15 https://thinkalong.ai.kr/projects >/dev/null
          test "$(curl --silent --show-error --max-time 15 -o /tmp/director-remote-health.json -w '%{http_code}' -H 'Origin: https://thinkalong.ai.kr' -H 'Content-Type: application/json' --data '{"action":"me"}' https://thinkalong.ai.kr/api/remote)" = 401

  inspect-tls:
    if: ${{ inputs.inspect_tls }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Certbot renewal
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle ~/.ssh/known_hosts
          ssh -i ~/.ssh/oracle "$USER@$HOST" 'bash -se' <<'REMOTE'
          . /etc/os-release
          printf '%s\n' "$PRETTY_NAME"
          sudo certbot --version || true
          systemctl list-unit-files '*certbot*' --no-pager
          systemctl list-timers --all '*certbot*' --no-pager
          sudo grep -E '^(authenticator|installer|webroot_path|pre_hook|post_hook|renew_hook) *=' /etc/letsencrypt/renewal/thinkalong.ai.kr.conf || true
          sudo openssl x509 -in /etc/letsencrypt/live/thinkalong.ai.kr/fullchain.pem -noout -dates
          sudo find /etc/letsencrypt/renewal-hooks -maxdepth 2 -type f -printf '%P\n'
          sudo ps -C certbot,nginx -o pid,ppid,etime,stat,wchan:28,comm || true
          for pid in $(pgrep -x certbot); do
            sudo ps --ppid "$pid" -o pid,ppid,etime,stat,wchan:28,comm || true
          done
          sudo stat -c '%y %n' /var/log/letsencrypt/letsencrypt.log
          sudo tail -n 100 /var/log/letsencrypt/letsencrypt.log | grep -Ei 'certbot version|entry point|discovered plugins|renewing an existing certificate|simulating renewal|performing the following challenges|waiting for verification|renewal configuration file|requested authenticator|selected authenticator|single candidate plugin|starting new HTTPS connection|waiting for a lock|acme directory|nginx restart' | tail -n 25 || true
          sudo tail -n 100 /var/log/letsencrypt/letsencrypt.log | grep -Eo 'ConnectTimeout[^: ]*|ReadTimeout[^: ]*|ConnectionError|NameResolutionError|Temporary failure in name resolution|CertificateVerificationError|SSLError|starting new HTTPS connection|Challenge failed|Some challenges have failed|Successfully received certificate|Failed to renew certificate|No renewals were attempted|nginx restart failed|timed out' | sort | uniq -c || true
          curl -fsS --connect-timeout 5 --max-time 10 -o /dev/null -w 'Production ACME directory: %{http_code}\n' https://acme-v02.api.letsencrypt.org/directory || true
          curl -fsS --connect-timeout 5 --max-time 10 -o /dev/null -w 'Staging ACME directory: %{http_code}\n' https://acme-staging-v02.api.letsencrypt.org/directory || true
          REMOTE
